helpMessage:
  "&e歡迎使用 Inventory Weight 插件！本插件會追蹤你背包物品負擔值，並依照總負擔值調整移動速度。
  你可以自訂物品負擔值、設定數量上限等。以下是一些常用指令：

  &7- &a/iw weight &f- 查看目前背包負擔值與速度。
  &7- &a/iw get &f- 查看手上物品的負擔值。
  &7- &a/iw get [Material Name] &f- 查看指定材質的預設負擔值。
  &7- &a/iw level &f- 查看等級帶來的最大負擔值加成。
  &7- &a/iw level set <player> <level> &f- 設定玩家等級（管理員）。
  &7- &a/iw level add <player> <delta> &f- 調整玩家等級增減（管理員）。
  &7- &a/iw reload &f- 重新載入插件設定。

  &e善用背包空間，避免被減速或無法移動！"
